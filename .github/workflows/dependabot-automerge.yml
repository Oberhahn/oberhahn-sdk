name: dependabot-automerge
# Auto-merge Dependabot PRs once CI passes — but only patch/minor bumps.
# Majors (e.g. actions/checkout 4→7) stay manual, since tests passing doesn't
# prove a major won't change behavior you rely on.
#
# This enables GitHub's *native* auto-merge, which only completes after the
# branch's REQUIRED status checks succeed. That gate is what "when tests pass"
# actually means — see the one-time setup in the repo (branch protection).
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable auto-merge for patch/minor updates
        if: >
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
