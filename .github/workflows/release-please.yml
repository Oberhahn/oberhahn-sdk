name: release-please
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Maintains a per-package "release PR" from conventional-commit history: it keeps
# the version + CHANGELOG up to date, and merging that PR tags the release
# (js-vX.Y.Z / python-vX.Y.Z). When the JS release is created, the publish-js job
# below invokes npm-publish.yml in the SAME run — release-please creates the
# Release with GITHUB_TOKEN, and events from GITHUB_TOKEN don't start new workflow
# runs, so a standalone `release: published` trigger would never fire.
jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      js_release_created: ${{ steps.release.outputs['js--release_created'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-js:
    needs: release-please
    if: needs.release-please.outputs.js_release_created == 'true'
    permissions:
      contents: read
      id-token: write # npm provenance
    uses: ./.github/workflows/npm-publish.yml
    secrets: inherit
