name: npm-publish
on:
  # Invoked by release-please.yml when the JS release is created. A `release:
  # published` trigger can't be used: release-please creates the Release with
  # GITHUB_TOKEN, and events from GITHUB_TOKEN don't start new workflow runs.
  workflow_call:
  # Manual publish from the current ref (backfill / re-run). Publishes whatever
  # version is in js/package.json on the selected branch.
  workflow_dispatch:

# Publishes @oberhahn/sdk to npm. Requires the NPM_TOKEN secret (an automation
# token for the @oberhahn org with publish rights). publishConfig.access=public
# in js/package.json handles scope; --provenance needs id-token: write.
jobs:
  npm-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # npm provenance
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Publish
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
