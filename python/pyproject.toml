[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oberhahn"
version = "0.1.0"
description = "Thin server-side SDK that wraps native provider SDKs, extracts token usage + attribution, and posts canonical events to OBERHAHN."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pinata" }]
keywords = [
    "oberhahn",
    "llm",
    "observability",
    "token-usage",
    "openai",
    "anthropic",
    "bedrock",
    "gemini",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
# No required runtime dependencies — the SDK uses only the standard library.
# Provider SDKs are optional; install only what you use (see [optional-dependencies]).
dependencies = []

[project.urls]
Homepage = "https://github.com/Oberhahn/oberhahn-sdk/tree/main/python#readme"
Repository = "https://github.com/Oberhahn/oberhahn-sdk"
Issues = "https://github.com/Oberhahn/oberhahn-sdk/issues"

[project.optional-dependencies]
# Provider SDKs are optional peer dependencies — install only what you use.
# Loose ranges on purpose: consumers shouldn't be pinned to an exact version.
# Development/CI uses the pinned requirements-dev.txt instead (which is what
# Dependabot bumps — loose ranges here would give it nothing to update).
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.30.0"]
bedrock = ["boto3>=1.34.0"]
gemini = ["google-genai>=1.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/oberhahn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
